<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ნელა ანდრია - რობლოქსის სკინები</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
      background: #87CEEB;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 12px;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 2px;
      color: #FFD700;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4);
      text-align: center;
    }

    p.subtitle {
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 8px;
      text-align: center;
    }

    .section-title {
      font-size: 10px;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .char-select {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 8px;
    }

    .char-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      cursor: pointer;
    }

    .char-card.selected {
      border-color: #FFD700;
      background: #0f172a;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }

    .char-avatar {
      width: 28px;
      height: 28px;
      margin: 0 auto 2px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    .char-name {
      font-size: 11px;
      font-weight: bold;
      color: #f8fafc;
    }

    .char-ability {
      font-size: 8px;
      color: #94a3b8;
    }

    .diff-select {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .diff-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .diff-btn.selected {
      border-color: #38bdf8;
      background: #0284c7;
    }

    .menu-buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
      cursor: pointer;
    }

    .btn-secondary {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    /* Shop Screen */
    #shopScreen {
      background: rgba(11, 15, 25, 0.98);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 380px;
      max-height: 52vh;
      overflow-y: auto;
      padding: 4px;
      margin-bottom: 10px;
    }

    .shop-item {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
    }

    .shop-item.owned {
      border-color: #22c55e;
    }

    .shop-item.equipped {
      border-color: #FFD700;
      background: #0f172a;
    }

    .shop-item-name {
      font-size: 11px;
      font-weight: bold;
      margin-top: 2px;
    }

    .shop-item-price {
      font-size: 10px;
      color: #fde047;
      margin-top: 1px;
    }

    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-box {
      background: rgba(15, 23, 42, 0.8);
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 11px;
      font-weight: bold;
    }

    .ability-meter {
      width: 70px;
      height: 5px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 2px;
    }

    .ability-fill {
      height: 100%;
      width: 100%;
      background: #38bdf8;
    }

    #dialogBox {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      max-width: 360px;
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid #FFD700;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 15;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    #npcAvatar { font-size: 28px; margin-bottom: 2px; }
    #dialogText { font-size: 12px; color: #f8fafc; margin-bottom: 8px; line-height: 1.3; }
    #closeDialogBtn { background: #eab308; color: #000; border: none; padding: 4px 16px; font-size: 11px; font-weight: bold; border-radius: 15px; cursor: pointer; }

    #mobile-controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .control-btn {
      pointer-events: auto;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .control-btn span { font-size: 18px; }
    .control-btn small { font-size: 7px; margin-top: 1px; font-weight: bold; }
    .control-btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.95); }
    .enter-btn { border-color: #eab308; background: rgba(234, 179, 8, 0.3); }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-box">
        ქულა: <span id="scoreText">0</span> | 🪙 <span id="coinsText">0</span> | <span id="locationText">ველები</span>
      </div>
      <div class="hud-box" style="text-align: right;">
        <span id="charAbilityText">უნარი</span>
        <div class="ability-meter">
          <div id="abilityFill" class="ability-fill"></div>
        </div>
      </div>
    </div>

    <!-- Dialog Box -->
    <div id="dialogBox" class="hidden">
      <div id="npcAvatar">🧍‍♂️</div>
      <div id="dialogText">მინიშნება...</div>
      <button id="closeDialogBtn">გაგებულია</button>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="hidden">
      <button class="control-btn jump-btn" id="btnJump">
        <span>⬆️</span>
        <small>ნახტომი</small>
      </button>
      <button class="control-btn skill-btn" id="btnAbility">
        <span>⚡</span>
        <small>უნარი</small>
      </button>
      <button class="control-btn enter-btn hidden" id="btnEnter">
        <span>🏠</span>
        <small>შესვლა</small>
      </button>
    </div>

    <!-- Start / Select Character & Difficulty -->
    <div id="startScreen" class="overlay">
      <h1>ნელა ანდრია!</h1>
      <p class="subtitle">აირჩიე რობლოქს სკინი და დაიწყე პარკური</p>

      <div class="section-title">პერსონაჟები:</div>
      <div class="char-select">
        <div class="char-card selected" id="card-ioane">
          <div class="char-avatar" style="background: #ef4444;">ი</div>
          <div class="char-name">იოანე</div>
          <div class="char-ability">ორმაგი</div>
        </div>
        <div class="char-card" id="card-andria">
          <div class="char-avatar" style="background: #3b82f6;">ა</div>
          <div class="char-name">ანდრია</div>
          <div class="char-ability">ფარი</div>
        </div>
        <div class="char-card" id="card-ilia">
          <div class="char-avatar" style="background: #10b981;">ი</div>
          <div class="char-name">ილია</div>
          <div class="char-ability">სპრინტი</div>
        </div>
        <div class="char-card" id="card-gabriel">
          <div class="char-avatar" style="background: #f59e0b;">გ</div>
          <div class="char-name">გაბრიელი</div>
          <div class="char-ability">Slow-Mo</div>
        </div>
      </div>

      <div class="section-title">სირთულე:</div>
      <div class="diff-select">
        <button class="diff-btn" id="diff-easy">🟢 იოლი</button>
        <button class="diff-btn selected" id="diff-medium">🟡 საშუალო</button>
        <button class="diff-btn" id="diff-hard">🔴 რთული</button>
      </div>

      <div class="menu-buttons">
        <button class="btn btn-secondary" id="openShopBtn">🛒 მაღაზია</button>
        <button class="btn" id="startBtn">დაწყება</button>
      </div>
    </div>

    <!-- Shop Screen -->
    <div id="shopScreen" class="overlay hidden">
      <h1>რობლოქს სკინების მაღაზია</h1>
      <p class="subtitle">შენი მონეტები: <span id="shopCoinsText">0</span> 🪙</p>
      
      <div class="shop-grid" id="shopGrid"></div>

      <button class="btn btn-secondary" id="closeShopBtn">მთავარ მენიუში</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const startScreen = document.getElementById('startScreen');
    const shopScreen = document.getElementById('shopScreen');
    const hud = document.getElementById('hud');
    const mobileControls = document.getElementById('mobile-controls');
    const dialogBox = document.getElementById('dialogBox');
    const dialogText = document.getElementById('dialogText');
    const closeDialogBtn = document.getElementById('closeDialogBtn');
    const scoreText = document.getElementById('scoreText');
    const coinsText = document.getElementById('coinsText');
    const shopCoinsText = document.getElementById('shopCoinsText');
    const locationText = document.getElementById('locationText');
    const abilityFill = document.getElementById('abilityFill');
    const charAbilityText = document.getElementById('charAbilityText');
    const btnJump = document.getElementById('btnJump');
    const btnAbility = document.getElementById('btnAbility');
    const btnEnter = document.getElementById('btnEnter');
    const startBtn = document.getElementById('startBtn');
    const openShopBtn = document.getElementById('openShopBtn');
    const closeShopBtn = document.getElementById('closeShopBtn');
    const shopGrid = document.getElementById('shopGrid');

    let gameRunning = false;
    let score = 0;
    let totalCoins = parseInt(localStorage.getItem('nela_coins') || '100');
    let gameSpeed = 5;
    let speedIncrement = 0.001;
    let gravity = 0.65;
    let frameCount = 0;

    let selectedCharKey = 'ioane';
    let selectedDiff = 'medium';

    // Roblox style skins setup
    const robloxThemes = ['Noob ჰუდი', 'Pro ბომბერი', 'Valkyrie ლუქსი', 'Dominus კოსტუმი', 'Neon კიბერპანკი', 'Classic რობლუქსერი', 'Cyber ჰაკერი', 'Gold ლეგენდა', 'Shadow ნინძა', 'Retro პიჯაკი'];
    const skinColors = ['#fde047', '#3b82f6', '#ef4444', '#10b981', '#a855f7', '#ec4899', '#06b6d4', '#f97316', '#64748b', '#ffffff'];

    let skins = [];
    let ownedSkins = JSON.parse(localStorage.getItem('nela_owned_skins') || '["skin_0"]');
    let equippedSkinId = localStorage.getItem('nela_equipped_skin') || 'skin_0';

    for (let i = 0; i < 100; i++) {
      let theme = robloxThemes[i % robloxThemes.length];
      let col = skinColors[i % skinColors.length];
      skins.push({
        id: `skin_${i}`,
        name: i === 0 ? 'Noob (კლასიკური)' : `Roblox სკინი #${i+1} (${theme})`,
        color: col,
        price: i === 0 ? 0 : i * 20
      });
    }

    const characters = {
      ioane: { name: 'იოანე', color: '#ef4444', ability: 'ორმაგი', maxJumps: 2 },
      andria: { name: 'ანდრია', color: '#3b82f6', ability: 'ფარი', maxJumps: 1 },
      ilia: { name: 'ილია', color: '#10b981', ability: 'სპრინტი', maxJumps: 1 },
      gabriel: { name: 'გაბრიელი', color: '#f59e0b', ability: 'Slow-Mo', maxJumps: 1 }
    };

    const biomes = [
      { name: 'ველები', skyDay: '#87CEEB', skyNight: '#0f172a', ground: '#22c55e', dirt: '#78350f' },
      { name: 'სანსეტი', skyDay: '#f97316', skyNight: '#1e1b4b', ground: '#475569', dirt: '#1e293b' },
      { name: 'კიბერპანკი', skyDay: '#d946ef', skyNight: '#020617', ground: '#06b6d4', dirt: '#0f172a' },
      { name: 'უდაბნო', skyDay: '#fde047', skyNight: '#312e81', ground: '#eab308', dirt: '#854d0e' },
      { name: 'ნანგრევები', skyDay: '#a8a29e', skyNight: '#1c1917', ground: '#78716c', dirt: '#292524' }
    ];

    let currentBiomeIndex = 0;
    let isNight = false;

    const npcClues = [
      "🧍‍♂️ მეგობარი: „მაგრად გამოიყურები ამ Roblox სკინით! შეაგროვე მონეტები.“",
      "🧍‍♂️ მეგობარი: „ყოველ 30 წამში სამყარო იცვლება! იყავი ფრთხილად.“",
      "🧍‍♂️ მეგობარი: „გამოიყენე სუპერ უნარები საშიშ ადგილებში.“",
      "🧍‍♂️ მეგობარი: „შენ ხარ ნამდვილი პარკურის ლეგენდა!“"
    ];
    let currentClueIndex = 0;

    const player = {
      x: 70, y: 0, width: 38, height: 56, vy: 0, jumpForce: '-14',
      isGrounded: false, jumpsLeft: 1, shieldActive: false, sprintActive: false,
      slowMoActive: false, abilityCooldown: 0, maxCooldown: 300, abilityTimer: 0
    };

    let obstacles = [], cars = [], drones = [], coins = [], platforms = [], ladders = [], houses = [], npcs = [], backgroundLayers = [], particles = [], activeHouseNear = null;

    function renderShop() {
      shopCoinsText.innerText = totalCoins;
      shopGrid.innerHTML = '';
      skins.forEach(skin => {
        const isOwned = ownedSkins.includes(skin.id);
        const isEquipped = equippedSkinId === skin.id;

        const itemDiv = document.createElement('div');
        itemDiv.className = `shop-item ${isOwned ? 'owned' : ''} ${isEquipped ? 'equipped' : ''}`;
        itemDiv.innerHTML = `
          <div style="width:24px; height:24px; background:${skin.color}; border:2px solid #000; border-radius:4px; margin:0 auto 2px;"></div>
          <div class="shop-item-name">${skin.name}</div>
          <div class="shop-item-price">${isOwned ? (isEquipped ? 'აცვია ✓' : 'არჩევა') : skin.price + ' 🪙'}</div>
        `;

        itemDiv.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (isOwned) {
            equippedSkinId = skin.id;
            localStorage.setItem('nela_equipped_skin', equippedSkinId);
            renderShop();
          } else {
            if (totalCoins >= skin.price) {
              totalCoins -= skin.price;
              ownedSkins.push(skin.id);
              equippedSkinId = skin.id;
              localStorage.setItem('nela_coins', totalCoins);
              localStorage.setItem('nela_owned_skins', JSON.stringify(ownedSkins));
              localStorage.setItem('nela_equipped_skin', equippedSkinId);
              renderShop();
            } else {
              alert('არ გაქვს საკმარისი მონეტები!');
            }
          }
        });
        shopGrid.appendChild(itemDiv);
      });
    }

    openShopBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      renderShop();
      startScreen.classList.add('hidden');
      shopScreen.classList.remove('hidden');
    });

    closeShopBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      shopScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    });

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'jump') {
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
          osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'coin') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: x, y: y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
          radius: Math.random() * 3 + 2, color: color, alpha: 1, decay: 0.04
        });
      }
    }

    ['ioane', 'andria', 'ilia', 'gabriel'].forEach(key => {
      const card = document.getElementById(`card-${key}`);
      if (card) {
        card.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          selectedCharKey = key;
          document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
        });
      }
    });

    ['easy', 'medium', 'hard'].forEach(diff => {
      const btn = document.getElementById(`diff-${diff}`);
      if (btn) {
        btn.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          selectedDiff = diff;
          document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
      }
    });

    function handleJump() {
      if (!gameRunning) return;
      if (player.isGrounded) {
        player.vy = -14;
        player.isGrounded = false;
        player.jumpsLeft = characters[selectedCharKey].maxJumps - 1;
        createParticles(player.x + 19, player.y + 56, '#fff');
        playSound('jump');
      } else if (selectedCharKey === 'ioane' && player.jumpsLeft > 0) {
        player.vy = -12;
        player.jumpsLeft--;
        createParticles(player.x + 19, player.y + 25, '#ef4444');
        playSound('jump');
      }
    }

    function handleEnterHouse() {
      if (!activeHouseNear || !gameRunning) return;
      const clue = npcClues[currentClueIndex % npcClues.length];
      currentClueIndex++;
      dialogText.innerText = clue;
      dialogBox.classList.remove('hidden');
      npcs.push({ x: activeHouseNear.x + 60, y: canvas.height - 120 });
    }

    if (closeDialogBtn) {
      closeDialogBtn.addEventListener('click', () => { dialogBox.classList.add('hidden'); });
    }

    function handleAbility() {
      if (!gameRunning) return;
      if (player.abilityCooldown <= 0) {
        player.abilityCooldown = player.maxCooldown;
        if (selectedCharKey === 'andria') { player.shieldActive = true; player.abilityTimer = 180; }
        else if (selectedCharKey === 'ilia') { player.sprintActive = true; player.abilityTimer = 150; }
        else if (selectedCharKey === 'gabriel') { player.slowMoActive = true; player.abilityTimer = 200; }
      }
    }

    function startGame() {
      startScreen.classList.add('hidden');
      shopScreen.classList.add('hidden');
      hud.classList.remove('hidden');
      mobileControls.classList.remove('hidden');
      dialogBox.classList.add('hidden');

      charAbilityText.innerText = `${characters[selectedCharKey].ability}`;

      if (selectedDiff === 'easy') { gameSpeed = 4.5; speedIncrement = 0.0005; }
      else if (selectedDiff === 'medium') { gameSpeed = 6.0; speedIncrement = 0.001; }
      else if (selectedDiff === 'hard') { gameSpeed = 8.0; speedIncrement = 0.0018; }

      score = 0; frameCount = 0; currentBiomeIndex = 0; isNight = false; currentClueIndex = 0;
      obstacles = []; cars = []; drones = []; coins = []; platforms = []; ladders = []; houses = []; npcs = []; backgroundLayers = []; particles = [];

      for (let i = 0; i < 8; i++) {
        backgroundLayers.push({ x: i * 220, y: canvas.height - 200, width: 140, height: 130, type: i % 2 === 0 ? 'mountain' : 'building', speedMultiplier: 0.2 });
      }

      const groundY = canvas.height - 80;
      player.y = groundY - player.height;
      player.vy = 0; player.isGrounded = true; player.abilityCooldown = 0;
      player.shieldActive = false; player.sprintActive = false; player.slowMoActive = false;

      gameRunning = true;
      requestAnimationFrame(gameLoop);
    }

    function returnToMainMenu() {
      gameRunning = false;
      playSound('hit');
      localStorage.setItem('nela_coins', totalCoins);
      hud.classList.add('hidden');
      mobileControls.classList.add('hidden');
      dialogBox.classList.add('hidden');
      startScreen.classList.remove('hidden');
    }

    if (startBtn) startBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); startGame(); });
    if (btnJump) btnJump.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); handleJump(); });
    if (btnAbility) btnAbility.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); handleAbility(); });
    if (btnEnter) btnEnter.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); handleEnterHouse(); });

    function gameLoop() {
      if (!gameRunning) return;
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      frameCount++;
      score += 0.1;
      scoreText.innerText = Math.floor(score);
      coinsText.innerText = totalCoins;

      const cycleFrame = frameCount % 1800;
      const newNight = cycleFrame >= 900;
      if (newNight && !isNight) { currentBiomeIndex = (currentBiomeIndex + 1) % biomes.length; }
      isNight = newNight;
      locationText.innerText = biomes[currentBiomeIndex].name;

      let currentSpeed = gameSpeed;
      if (player.sprintActive) currentSpeed *= 1.7;
      if (player.slowMoActive) currentSpeed *= 0.4;
      gameSpeed += speedIncrement;

      if (player.abilityCooldown > 0) player.abilityCooldown--;
      abilityFill.style.width = `${((player.maxCooldown - player.abilityCooldown) / player.maxCooldown) * 100}%`;

      if (player.abilityTimer > 0) {
        player.abilityTimer--;
        if (player.abilityTimer <= 0) { player.shieldActive = false; player.sprintActive = false; player.slowMoActive = false; }
      }

      if (frameCount % 280 === 0) {
        const pX = canvas.width;
        const pY = canvas.height - 200 - Math.random() * 70;
        platforms.push({ x: pX, y: pY, width: 120, height: 18 });
        coins.push({ x: pX + 45, y: pY - 25, radius: 9, collected: false });

        if (Math.random() > 0.4) {
          const groundY = canvas.height - 80;
          ladders.push({ x: pX + 30, y: groundY - 110, width: 22, height: 110 });
          houses.push({ x: pX + 55, y: groundY - 130, width: 75, height: 70 });
        }
      }

      if (frameCount % 240 === 0) { cars.push({ x: canvas.width, y: canvas.height - 115, width: 60, height: 30, speed: currentSpeed * 1.4 }); }
      if (frameCount % 340 === 0) { drones.push({ x: canvas.width, y: canvas.height - 250 - Math.random() * 80, width: 30, height: 22, speed: currentSpeed * 1.2 }); }

      if (frameCount % Math.max(50, Math.floor(110 - gameSpeed * 4)) === 0) {
        const groundY = canvas.height - 80;
        obstacles.push({ x: canvas.width, y: groundY - 30, width: 30, height: 30, type: 'spike' });
        if (Math.random() > 0.5) coins.push({ x: canvas.width + 40, y: groundY - 55, radius: 9, collected: false });
      }

      player.vy += gravity;
      player.y += player.vy;

      const groundY = canvas.height - 80;
      player.isGrounded = false;

      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height;
        player.vy = 0; player.isGrounded = true;
        player.jumpsLeft = characters[selectedCharKey].maxJumps;
      }

      platforms.forEach(p => {
        if (player.x + player.width > p.x && player.x < p.x + p.width &&
            player.y + player.height >= p.y && player.y + player.height - player.vy <= p.y + 10 && player.vy >= 0) {
          player.y = p.y - player.height;
          player.vy = 0; player.isGrounded = true;
          player.jumpsLeft = characters[selectedCharKey].maxJumps;
        }
      });

      backgroundLayers.forEach(b => {
        b.x -= currentSpeed * b.speedMultiplier;
        if (b.x + b.width < 0) b.x = canvas.width + 40;
      });

      particles.forEach((pt, idx) => {
        pt.x += pt.vx; pt.y += pt.vy; pt.alpha -= pt.decay;
        if (pt.alpha <= 0) particles.splice(idx, 1);
      });

      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.x -= currentSpeed;
        if (!c.collected && player.x < c.x + c.radius && player.x + player.width > c.x - c.radius &&
            player.y < c.y + c.radius && player.y + player.height > c.y - c.radius) {
          c.collected = true; 
          totalCoins += 5; // 1 მონეტის აღება = 5 მონეტა
          localStorage.setItem('nela_coins', totalCoins);
          playSound('coin'); createParticles(c.x, c.y, '#fde047');
        }
        if (c.x + c.radius < 0 || c.collected) coins.splice(i, 1);
      }

      for (let i = cars.length - 1; i >= 0; i--) {
        const car = cars[i]; car.x -= car.speed;
        if (player.x < car.x + car.width && player.x + player.width > car.x &&
            player.y < car.y + car.height && player.y + player.height > car.y) {
          if (player.shieldActive) { cars.splice(i, 1); player.shieldActive = false; playSound('hit'); continue; }
          else { returnToMainMenu(); return; }
        }
        if (car.x + car.width < 0) cars.splice(i, 1);
      }

      for (let i = drones.length - 1; i >= 0; i--) {
        const dr = drones[i]; dr.x -= dr.speed;
        if (player.x < dr.x + dr.width && player.x + player.width > dr.x &&
            player.y < dr.y + dr.height && player.y + player.height > dr.y) {
          if (player.shieldActive) { drones.splice(i, 1); player.shieldActive = false; playSound('hit'); continue; }
          else { returnToMainMenu(); return; }
        }
        if (dr.x + dr.width < 0) drones.splice(i, 1);
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i]; obs.x -= currentSpeed;
        if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
            player.y < obs.y + obs.height && player.y + player.height > obs.y) {
          if (player.shieldActive) { obstacles.splice(i, 1); player.shieldActive = false; playSound('hit'); continue; }
          else { returnToMainMenu(); return; }
        }
        if (obs.x + obs.width < 0) obstacles.splice(i, 1);
      }

      activeHouseNear = null;
      houses.forEach(h => {
        h.x -= currentSpeed;
        if (Math.abs(player.x - h.x) < 50) activeHouseNear = h;
      });

      if (btnEnter) {
        if (activeHouseNear) btnEnter.classList.remove('hidden');
        else btnEnter.classList.add('hidden');
      }

      platforms.forEach((p, idx) => { p.x -= currentSpeed; if (p.x + p.width < 0) platforms.splice(idx, 1); });
      ladders.forEach((l, idx) => { l.x -= currentSpeed; if (l.x + l.width < 0) ladders.splice(idx, 1); });
      houses.forEach((h, idx) => { if (h.x + h.width < 0) houses.splice(idx, 1); });
      npcs.forEach((npc, idx) => { npc.x -= currentSpeed; if (npc.x < -40) npcs.splice(idx, 1); });
    }

    function draw() {
      const currentBiome = biomes[currentBiomeIndex];
      ctx.fillStyle = isNight ? currentBiome.skyNight : currentBiome.skyDay;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      backgroundLayers.forEach(b => {
        ctx.fillStyle = isNight ? 'rgba(30, 41, 59, 0.7)' : 'rgba(255, 255, 255, 0.5)';
        if (b.type === 'mountain') {
          ctx.beginPath(); ctx.moveTo(b.x, canvas.height - 80);
          ctx.lineTo(b.x + b.width / 2, b.y); ctx.lineTo(b.x + b.width, canvas.height - 80); ctx.fill();
        } else { ctx.fillRect(b.x, b.y + 20, b.width, 110); }
      });

      const groundY = canvas.height - 80;

      houses.forEach(h => {
        ctx.fillStyle = '#854d0e'; ctx.fillRect(h.x, h.y, h.width, h.height);
        ctx.fillStyle = '#dc2626'; ctx.beginPath();
        ctx.moveTo(h.x - 8, h.y); ctx.lineTo(h.x + h.width / 2, h.y - 25); ctx.lineTo(h.x + h.width + 8, h.y); ctx.fill();
        ctx.fillStyle = '#451a03'; ctx.fillRect(h.x + 20, h.y + 30, 24, 35);
      });

      ladders.forEach(l => {
        ctx.fillStyle = '#d97706'; ctx.fillRect(l.x, l.y, 3, l.height); ctx.fillRect(l.x + l.width, l.y, 3, l.height);
        for (let step = l.y; step < l.y + l.height; step += 14) { ctx.fillRect(l.x, step, l.width, 3); }
      });

      platforms.forEach(p => {
        ctx.fillStyle = '#b45309'; ctx.fillRect(p.x, p.y, p.width, p.height);
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(p.x, p.y, p.width, 4);
      });

      coins.forEach(c => {
        if (!c.collected) {
          ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 2; ctx.stroke();
        }
      });

      npcs.forEach(npc => {
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(npc.x, npc.y, 22, 36);
        ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(npc.x + 11, npc.y - 7, 9, 0, Math.PI * 2); ctx.fill();
      });

      cars.forEach(car => {
        ctx.fillStyle = '#ef4444'; ctx.fillRect(car.x, car.y + 8, car.width, car.height - 8);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(car.x + 8, car.y, car.width - 16, 12);
        ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(car.x + 8, car.y + 26, 6, 0, Math.PI * 2); ctx.arc(car.x + car.width - 8, car.y + 26, 6, 0, Math.PI * 2); ctx.fill();
      });

      drones.forEach(dr => {
        ctx.fillStyle = '#dc2626'; ctx.fillRect(dr.x, dr.y, dr.width, dr.height);
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(dr.x + 8, dr.y + 6, 14, 6);
      });

      ctx.fillStyle = currentBiome.ground; ctx.fillRect(0, groundY, canvas.width, 80);
      ctx.fillStyle = currentBiome.dirt; ctx.fillRect(0, groundY + 10, canvas.width, 70);

      obstacles.forEach(obs => {
        ctx.fillStyle = '#dc2626'; ctx.beginPath();
        ctx.moveTo(obs.x, obs.y + obs.height); ctx.lineTo(obs.x + obs.width / 2, obs.y); ctx.lineTo(obs.x + obs.width, obs.y + obs.height); ctx.fill();
      });

      particles.forEach(pt => {
        ctx.fillStyle = pt.color; ctx.globalAlpha = pt.alpha;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1.0;
      });

      // Roblox Blocky 3D-styled Character Skin Rendering
      const currentSkin = skins.find(s => s.id === equippedSkinId) || skins[0];
      if (player.shieldActive) {
        ctx.beginPath(); ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 36, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(59, 130, 246, 0.4)'; ctx.fill(); ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 3; ctx.stroke();
      }

      const px = player.x; const py = player.y;

      // Roblox Square Head (Blocky style with outline)
      ctx.fillStyle = '#ffdbac';
      ctx.fillRect(px + 4, py, 30, 22);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 4, py, 30, 22);

      // Roblox Headwear / Cap based on skin color
      ctx.fillStyle = currentSkin.color;
      ctx.fillRect(px + 3, py - 4, 32, 8);

      // Roblox Torso (Blocky)
      ctx.fillStyle = currentSkin.color;
      ctx.fillRect(px + 6, py + 22, 26, 22);
      ctx.strokeStyle = '#1e293b';
      ctx.strokeRect(px + 6, py + 22, 26, 22);

      // Roblox Arms (Blocky blocks)
      ctx.fillStyle = currentSkin.color;
      ctx.fillRect(px, py + 22, 5, 18);
      ctx.fillRect(px + 33, py + 22, 5, 18);

      // Roblox Legs (Blocky blocks)
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(px + 8, py + 44, 10, 12);
      ctx.fillRect(px + 20, py + 44, 10, 12);
    }
  </script>
